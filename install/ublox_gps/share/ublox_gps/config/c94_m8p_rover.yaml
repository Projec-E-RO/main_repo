# c94_m8p_rover.yaml

ublox_gps_node:
  ros__parameters:
    debug: 1                    # Range 0-4 (0 means no debug statements will print)


    save:
      mask: 3103                # Save I/O, Message, INF Message, Nav, Receiver
      device: 4                 # Save to EEPROM

    device: /dev/ttyACM0
    frame_id: gps
    rate: 1.0                   # in Hz
    nav_rate: 1                 # [# of measurement cycles], recommended 1 Hz, may
    dynamic_model: automotive     # Airborne < 2G, 2D fix not supported (3D only)
    fix_mode: auto
    enable_ppp: false
    dr_limit: 0

    # TMODE3 Config
    tmode3: 0                # Survey-In Mode
 #   sv_in:
 #     reset: false
 #     min_dur: 300
 #     acc_lim: 3.0

      
    usb:
      in: 35
      out: 3
 
    enable_rtcm_input: true

    gnss:
      glonass: true
      beidou: false
      qzss: true
      galileo: false

    dgnss_mode: 3

    inf:
      all: true

    publish:
      all: true
      aid:
        hui: false
      nav:
        posecef: false

  
